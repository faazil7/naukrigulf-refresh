name: Naukri Gulf Profile Auto-Refresh

on:
  schedule:
    # Runs every hour, skipping 12:00 AM to 7:00 AM IST.
    # IST is UTC+5:30. 12:00 AM IST = 18:30 UTC (previous day). 7:00 AM IST = 01:30 UTC.
    # Therefore, we run between 01:30 UTC and 18:30 UTC (i.e. hours 2 to 18 UTC covers 7:30 AM to 12:00 AM IST).
    - cron: '0 2-18 * * *'
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Install Playwright Chromium & System Dependencies
        run: |
          npm install -g playwright
          playwright install --with-deps chromium
          ls -R /home/runner/.cache/ms-playwright/
        shell: bash

      - name: Run Profile Refresh
        env:
          NAUKRI_EMAIL: ${{ secrets.NAUKRI_EMAIL }}
          NAUKRI_PASSWORD: ${{ secrets.NAUKRI_PASSWORD }}
          HEADLESS: 'true'
        run: node index-gulf.js refresh
